services:
  portfolio-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: portfolio-web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mc-net

networks:
  mc-net:
    external: true
    name: minecraft_mc-net
